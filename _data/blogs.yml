- title: "ऑफिस-ऑफिस"
  lines: |
    कहाँ जा रहे हो, हर्ष?
    मस्तान, मैं बहुत बिजी हूँ। सुबह १० बजे से काम कर रहा हूँ, अभी अचानक ऑफिस से फोन आ गया, अब वहाँ जाना पड़ेगा।
    क्यों हर्ष, ऑफिस में जाना पड़ेगा मतलब? कौन से ऑफिस वैसे?
    फोन तो रिसर्च ऑफिस से आया है, पर जा ही रहा हूँ तो सारे ऑफिस चला जाऊँगा। सबमें थोड़ा-बहुत काम है ही—फैकल्टी अफेयर्स, सैलरी, रिसर्च, कुछ ट्रैवल के लिए बाल्मर लॉरी, और उधर से फिर इनोवेशन हब भी चला जाऊँगा।
    ओह, याद आया मुझे, हर्ष। मुझे भी रिसर्च ऑफिस जाना था। चलो, मैं भी चलता हूँ। अपराजिता से भी पूछ लेता हूँ, उनको भी शायद रिसर्च ऑफिस में प्रोजेक्ट से रिलेटेड कुछ काम था शायद।
    ओहो। मस्तान, ऐसा लगता है ऑफिस-ऑफिस करते-करते ही दिन निकल जाता है। काम कब करूँ, समझ ही नहीं आता।
    हाँ हर्ष, सही बोल रहे हो। वैसे तुमने बोला सुबह १० बजे से काम कर रहे हो, रात में भी लेट हो गया होगा काम करते-करते।
    हाँ मस्तान, कल रात में न, मैंने आज का ऑफिस का काम सोचते-सोचते बहुत लेट सोया, लगभग १० बज गए थे। पर एक बात तो है कि ऑफिस जाने से ऐसा लगता है कि कुछ काम आगे बढ़ रहा है। वरना अपने केबिन में बैठे-बैठे तो मीटिंग में ही टाइम निकल जाता है।
    हाँ हर्ष, केबिन में मीटिंग-मीटिंग और बाकी टाइम ऑफिस-ऑफिस।
    ....................
    रिसर्च ऑफिस
    ....................
    सबसे पहले हम लोग यूटिलाइजेशन सर्टिफिकेट वाले सेक्शन में चलते हैं, मस्तान।
    अरे, अभी तो तुमने दो वीक पहले ही यूसी किया था न और सबमिट भी किया था, हर्ष।
    हाँ, बस वो तीसरी बार रिवर्ट आया। जमा करने के एक वीक बाद ही रिवर्ट आ गया था। बहुत फास्ट प्रोसेसिंग करते हैं वो लोग भी। एक वीक में ही रिजेक्ट कर देते हैं, फटाफट एक नया कारण बता कर, जो पिछली बार नहीं बताए, कि कहीं हमको ज्यादा चेंज न करने पड़ जाएँ।
    और उसके आते ही मैंने अपने यहाँ के यूसी डिपार्टमेंट को ईमेल कर दिया था। हो गए एक वीक, तो सोचा याद दिला दूँ।
    आपने भी तो कुछ दिनों पहले ही जमा किया था न, फिर क्या हुआ, मस्तान?
    अरे, इस बार तो कुछ नया बोलके रिजेक्ट किया उन्होंने। समझ नहीं रहा। चलो, चलके पूछते हैं।
    ३ लोग अपने काम में लगे हुए हैं, ढेर सारी फाइल्स बिखरी पड़ी हैं। बहुत काम मालूम पड़ता है, इसीलिए शायद हम लोगों का ईमेल नहीं पढ़ पाए होंगे।
    हेलो सर, हर्ष का एक ईमेल चेक करेंगे क्या? मैंने आपको कुछ सुधार करने के लिए भेजा है।
    हाँ सर, देखते हैं।
    देखने के बाद—
    हर्ष: कब तक हो जाएगा? ऑलरेडी बहुत महीने बीत गए हैं, मेनपावर लोन भी लेकर रखा है।
    हो जाएगा, सर। एक्चुअली हमारे चार्टर्ड अकाउंटेंट सर ही नहीं हैं, अगले वीक आएँगे। उनके आते ही हो जाएगा।
    मस्तान का कब तक हो पाएगा? इनको तो आज ही जाना है। देखिए जरा, इनमें तो शायद कुछ अजीब सा चेंज है, पर मिनिमल ही है। शायद आपके चार्टर्ड अकाउंटेंट सर के दोबारा अप्रूवल की जरूरत नहीं है।
    ठीक है, एक बार लंच के बाद आइए सर।
    जी, ठीक है। धन्यवाद।
    अब बिलिंग डिपार्टमेंट चलते हैं।
    सर, मैंने ६ इंटर्न के बिलिंग के लिए आपको भेजा था। ५ का हो गया है, एक का नहीं हो पाया है। आप चेक करेंगे क्या?
    सर, लग रहा है रिवर्ट आ गया होगा।
    तो पता कीजिए, कन्फर्म कीजिए और रिजॉल्व कीजिए।
    सर, किसी को तो पता करना होगा। आप पता करवा लेंगे, फिर हम आगे का बता देंगे।
    ओह। कौन पता करके देगा? आपको कुछ आइडिया है, सर?
    नहीं सर।
    अच्छा जी, ठीक है।
    फिर मैं सैलरी ऑफिस गया। एक कॉन्फ्रेंस के बिल्स क्लियर नहीं हुए हैं अब तक।
    सर, आओ चेक करेंगे क्या? हर्ष के नाम से ९९,००० का एक बिल है।
    सर, मैं तो नया हूँ अभी। मैं तो लास्ट वीक से ही हैंडल कर रहा हूँ।
    सर, आप चेक का कीजिए। इस डेट को आया था मेरे पास अप्रूवल। एक बार चेक कीजिए।
    सर, इसमें तो कुछ नहीं दिख रहा है। आओ, वापस जाके फैकल्टी अफेयर्स में ही पता कीजिए।
    इस प्रकार मैं फैकल्टी अफेयर्स जाके पता किया और उनको इससे फॉलो-अप करने का रिक्वेस्ट किया।
    फिर बाकी सारे ऑफिस से हम लोग बातचीत करके वापस अपने केबिन आ गए।
    लगभग १:३० बज गए। काफी काम कर लिया, ऐसा लग रहा है। बहुत कुछ अपडेट हो गया। उम्मीद है कि एक सप्ताह में सब काम हो जाएगा।
    लंच चले फिर अब, मस्तान?
    हाँ, चलो हर्ष।
    लंच के बाद मस्तान यूसी ऑफिस गए होंगे।
    ....................
    एक वीक बाद।
    ....................
    बहुत कम पेंडिंग लग रहा है। ऑफिस में जितनी जगह गए थे, उनमें से खास कुछ अपडेट वापस नहीं आया है। एक बार फोन करके पूछ लेता हूँ।
    रिंग रिंग रिंग रिंग...
    कुछ फोन उठे, कुछ नहीं उठे।
    फिर कुछ फॉलो-अप ईमेल भेज दिए गए।
    मस्तान, कॉफी टाइम?
    कॉफी पे फिर हमने जीवन की गूढ़ बातों पर चर्चा की। काम का क्या है, चलता रहेगा।
    हँसते रहिए और स्वस्थ रहिए।

- title: "चुनाव"
  lines: |
    चुनाव कितना जरूरी है। जीवन के हर मोड पे हमें कुछ न कुछ चुनाव करना होता है। अक्सर पीछे मुड़कर कितने लोग अपने चुनाव को सही ठहराते है, या बस जीवन कि आपाधापी में फिर से मसगूल हो जाते है। जीवन में कई चुनाव बस एक काश छोड़ जाती है। कभी कभी तो अपने चुनाव पे यकीन नहीं होता। खैर मैं बात करना चाहता हूँ लोकतंत्र में चुनाव की। और बहुत संतुष्ट महसूस कर रहा हूँ इस बात के लिए कि इस बार चुनाव पे न के बराबर किसी से चर्चा की। वरना अपनी आदत से मजबूर कहीं बिना पेंदी के लोटे की तरह लड़ पड़ता। पक्ष वालों से विपक्ष के लिए और विपक्ष वालों से पक्ष के लिए। पर इसके पीछे मेरे मन में यही बात रहती है, कोई पूरा गलत तो नहीं होता न। कैसे किसी को पूरा सही या पूरा गलत मान ले। यह बात आम जीवन में भी लागू होती है। 
    फिर से अगर लोकसभा चुनाव पे फोकस करे तो मेरी समझ से यह चुनाव पिछले कई दशकों में सबसे निराशावादी चुनाव था, इसलिए नहीं क्यूंकि मैंने लड़ाई नहीं की। बल्कि इसलिए क्यूंकि पक्ष से विशेष उम्मीद नहीं और विपक्ष तो मानों है ही नहीं। पर कुछ आवाज ऐसे सुनने मिले, जिसने लोगो के मन में एक सवाल पैदा तो जरूर किया  कि बिहार से सांसद तो ४० है पर इन्वेस्टमेंट सिर्फ गुजरात में क्यों। काबिल कोई भी हो पर नेता का बेटा ही नेता क्यों। ऐसे लोग उम्मीद तो जगाते है पर हमने ऐसे लोगो को पूरा पलटते भी देखा है। जो फिर यह सोचने को मजबूर करता है कि कोई पका हुआ आदमी जिसका कोई तो विचारधारा हो, देश के लिए वही शायद अभी के लिए ज्यादा जरूरी है। पर यह तो इस बात के विपरीत है कि लोग खुश होंगे तो देश खुशहाल होगा। पता नहीं, यह सवाल मैं आपके उपर ही छोड़ देता हूँ।
    पूर्व राष्ट्रपति प्रणव मुख़र्जी ने ६७ गणतंत्र दिवस पर कहा था "There will be, amongst us, occasional doubters and baiters. Let us continue to complain; to demand; to rebel. This too is a virtue of democracy. But let us also applaud what our democracy has achieved."
    इस लिए तमाम संकाओ के बाद भी, इस चुनाव का अच्छे से संपन्न होना, एक उपलब्धि है, देश के सभी नागरिको की। उसके विपरीत, मैंने चुनाव का कर्तव्य पूरा न करके और उसके ऊपर ज्ञान बाटके एक काश छोड़ दिया। पर आने वाले ४ जून को देश को फिर से एक अच्छा नेतृव्त मिलेगा इसका भरोसा रखे, क्यूंकि चुनाव तो हमने या हमारे ही अपनों ने किया है न। 

- title: "असहिष्णुता"
  lines: |
    विचारों में मतभेद व्यवहार में शून्यता ला रही है। यह सोचकर सबसे पहले मुझे संसद और सांसदों की याद आती है। बाद में उन सभी साहित्य पंडितो और अभिनय कलाकारों की जो असहिष्णुता की बाते करते है। पर, वास्तविकता इससे परे है। अगर हमारे चक्षु खुले हो तो यह असहिष्णुता हमारे परिवार, समाज में पनप कर बड़ा आकार ले चुका है जहां विचारो में भिन्नता आपसी कटुता का कारण हो गई है। मुझे गांधीजी की याद आती है, नेताजी के विचारो से असहमत होकर भी बापू उन्हें प्रिय मानते थे। और नेताजी भी उन्हें "greatest Indian" कहकर संभोधित करते थे। ऐसा नहीं की उस समय असहिस्नु लोग नहीं रहे होंगे। हर कल खंड में ऐसे लोग होते है। पर उस समय मर्यादित पदो पे, घर के बड़े बुजुर्गो ने एक आदर्श स्थापित किया था। आज की राजनीतिक और सामाजिक परिदृश्य से तो आप अनभिज्ञ नहीं ही होंगे। क्योंकि सारी कमियों और बुराइयों की निरीक्षण और प्रसिस्क्षण करने की विलक्षण प्रतिभा तो हमने आदिकाल से संजोकर रखा है।
    मूलतः मै पारिवारिक और निकटतम परिवेश में जकड़े हुए इस समस्या को highlight करना चाहता हूं। और पूरी ईमानदारी के साथ खुद को इसका हिस्सा और जिम्मेदार मानता हूं। पर शायद ये साझा करके हम और आप तनिक सोचेंगे और इस पर प्रकाश डालेंगे। अगर हम सहमत होंगे तो कोशिश करेंगे। इस अध्ययन में एक और महत्वपूर्ण बात आपसे साझा करना चाहता हूं। हमारा समाज, सरकार और सबसे महत्वपूर्ण परिवार ऐसी नीतियों पे काम कर रहा है जिसके पास "problem statement" नहीं है, सिर्फ है तो कृत्रिम नुस्खे। उदाहरण स्वरूप आज की शिक्षा व्यवस्था को ही ले लीजिए। मै उसकी गहराई में नहीं जाना चाहूंगा। पर मुझे इससे निष्कर्ष यह निकालना था कि हम जिस मूल समस्या की बात कर रहे है, उसके हल का एक मंत्र यह हो सकता है कि हम दूसरों पे विश्वास, उनके कार्य प्रणाली पे विश्वास करे। क्योंकि कोई भी सोच कर गलत नहीं करता, उसके अनुसार से वो सही ही रहा होगा। तो सबसे महत्वपूर्ण बात आती है बातचीत की, हां अटलजी वाली बातचीत। "Heated discussions" भी होनी चाहिए। पर, उसके बाद यदि साथ में खाना और गाना ही जाए बस फिर तो आनन्द ही आनन्द। और हां यही सही समय है बात करने की, अपने झूठे अहंकार को कुचलकर बातचीत करने की। इसको हम एक "progressive society, nation" के theory की तरह देख सकते है बशर्ते फूहड़ बाते और फब्तियां कसने के बाद कैंडल मार्च करने वालो से। हां पर उनसे भी मेरे वैचारिक मतभेद है, व्यावहारिक नहीं।।
